services:
  postgres:
    image: postgres:16
    container_name: yad2-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-yad2}
      POSTGRES_USER: ${POSTGRES_USER:-yad2}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-yad2}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-yad2} -d ${POSTGRES_DB:-yad2}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8.6.4-alpine
    container_name: yad2-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  migrate:
    build:
      context: ../..
      dockerfile: infra/compose/Dockerfile
    env_file:
      - ../../.env
    command: alembic upgrade head
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: ../..
      dockerfile: infra/compose/Dockerfile
    container_name: yad2-api
    env_file:
      - ../../.env
    command: uvicorn apps.api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: ../..
      dockerfile: infra/compose/Dockerfile
    container_name: yad2-worker
    env_file:
      - ../../.env
    command: python -m apps.worker.main
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  scheduler:
    build:
      context: ../..
      dockerfile: infra/compose/Dockerfile
    container_name: yad2-scheduler
    env_file:
      - ../../.env
    command: python -m apps.scheduler.main
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  notifier:
    build:
      context: ../..
      dockerfile: infra/compose/Dockerfile
    container_name: yad2-notifier
    env_file:
      - ../../.env
    command: python -m apps.notifier.main
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  pgadmin:
    image: dpage/pgadmin4:9.15
    container_name: yad2-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@local.dev}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
      - ./pgadmin/pgpass:/pgpass:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  portainer:
    image: portainer/portainer-ce:2.39.3
    container_name: yad2-portainer
    ports:
      - "${PORTAINER_PORT:-9000}:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    restart: unless-stopped

  redisinsight:
    image: redis/redisinsight:3.4.2
    container_name: yad2-redisinsight
    environment:
      RI_ACCEPT_TERMS_AND_CONDITIONS: "true"
    ports:
      - "${REDISINSIGHT_PORT:-5540}:5540"
    volumes:
      - redisinsight_data:/data
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
    name: yad2_postgres_data
  pgadmin_data:
    name: yad2_pgadmin_data
  portainer_data:
    name: yad2_portainer_data
  redisinsight_data:
    name: yad2_redisinsight_data
